<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Свет Веры — Новый Завет</title>
    <style>
        /* Все стили вшиты внутрь файла — сайт работает мгновенно и без сбоев в Safari */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #E5DEC9;
            color: #4A3222;
            min-height: 100vh;
        }
        .app-shell {
            max-width: 480px;
            margin: 0 auto;
            background-color: #FDFBF7;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 35px rgba(92, 64, 51, 0.18);
            display: flex;
            flex-direction: column;
        }
        .hide { display: none !important; }

        /* Кнопки 3D в стиле Duolingo */
        .btn-brown {
            width: 100%;
            background-color: #8B5A2B;
            color: #FFFFFF;
            border: none;
            padding: 16px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 0 #5C3A1B;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-brown:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #5C3A1B;
        }
        .btn-beige {
            width: 100%;
            background-color: #EFE6D5;
            color: #5C4033;
            border: 2px solid #D5C3A6;
            padding: 14px 16px;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 4px 0 #D5C3A6;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-beige:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #D5C3A6;
        }

        /* Карточки */
        .card-3d {
            background: #FFFFFF;
            border: 2px solid #E6DEC8;
            box-shadow: 0 5px 0 #E6DEC8;
            border-radius: 24px;
            padding: 18px;
        }

        /* Экран Входа и Регистрации */
        #auth-screen {
            min-height: 100vh;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: #FDFBF7;
        }
        .logo-circle {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: #F4EAD8;
            border: 4px solid #D5C3A6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            margin-bottom: 14px;
            position: relative;
            animation: float 3s ease-in-out infinite;
        }
        .logo-star {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background: #E09F1F;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            border: 3px solid #FDFBF7;
        }
        .mode-switch {
            width: 100%;
            background: #EFE6D5;
            padding: 5px;
            border-radius: 16px;
            display: flex;
            margin: 20px 0 18px;
            border: 2px solid #E2D5BE;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: transparent;
            font-weight: 800;
            font-size: 14px;
            color: #8B6B4E;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #FFFFFF;
            color: #4A3222;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .field-group {
            width: 100%;
            text-align: left;
            margin-bottom: 12px;
        }
        .field-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #8B6B4E;
            margin-left: 6px;
            display: block;
            margin-bottom: 4px;
        }
        .field-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 2px solid #DFD2BC;
            background: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            color: #4A3222;
            outline: none;
        }
        .field-input:focus {
            border-color: #8B5A2B;
        }
        .error-banner {
            width: 100%;
            background: #FDE8E8;
            border: 2px solid #F5B5B5;
            color: #B83333;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 800;
            margin-top: 8px;
            text-align: left;
        }

        /* Верхняя панель */
        #top-bar {
            position: sticky;
            top: 0;
            z-index: 25;
