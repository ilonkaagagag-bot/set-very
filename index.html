<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Новый Завет - Обучение</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Nunito (Duolingo style) -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #E5DEC9;
            margin: 0;
            padding: 0;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #FDFBF7;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 35px rgba(92, 64, 51, 0.18);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .btn-duo-brown {
            background-color: #8B5A2B;
            color: #FFFFFF;
            box-shadow: 0 5px 0 #5C3A1B;
            transition: all 0.1s ease;
            cursor: pointer;
        }
        .btn-duo-brown:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #5C3A1B;
        }
        .btn-duo-beige {
            background-color: #EFE6D5;
            color: #5C4033;
            border: 2px solid #D5C3A6;
            box-shadow: 0 4px 0 #D5C3A6;
            transition: all 0.1s ease;
            cursor: pointer;
        }
        .btn-duo-beige:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #D5C3A6;
        }
        .card-3d {
            background-color: #FFFFFF;
            border: 2px solid #E6DEC8;
            box-shadow: 0 5px 0 #E6DEC8;
            border-radius: 24px;
        }
        .node-active {
            background: linear-gradient(145deg, #9C6735, #8B5A2B);
            color: white;
            box-shadow: 0 7px 0 #5C3A1B, 0 12px 20px rgba(139, 90, 43, 0.35);
            border: 4px solid #FFF8EE;
        }
        .node-ActivePulse {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 7px 0 #5C3A1B, 0 0 0 0 rgba(139, 90, 43, 0.5); }
            70% { box-shadow: 0 7px 0 #5C3A1B, 0 0 0 14px rgba(139, 90, 43, 0); }
            100% { box-shadow: 0 7px 0 #5C3A1B, 0 0 0 0 rgba(139, 90, 43, 0); }
        }
        .node-completed {
            background: linear-gradient(145deg, #F5B727, #E09F1F);
            color: white;
            box-shadow: 0 7px 0 #B57C0E;
            border: 4px solid #FFFDF9;
        }
        .node-locked {
            background-color: #E8E0CE;
            color: #A69982;
            box-shadow: 0 7px 0 #C9BDA6;
            border: 4px solid #F7F3EB;
        }
        .perspective { perspective: 1000px; }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 220px;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .flip-card-front {
            background-color: #FFFFFF;
            border: 3px solid #D5C3A6;
            box-shadow: 0 6px 0 #D5C3A6;
        }
        .flip-card-back {
            background-color: #FFF8EB;
            border: 3px solid #E09F1F;
            box-shadow: 0 6px 0 #E09F1F;
            transform: rotateY(180deg);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .hide { display: none !important; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .mascot-float { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>

<div class="app-container">

    <div id="auth-screen" class="min-h-screen w-full bg-[#FDFBF7] z-50 flex flex-col justify-between p-7">
        <div class="flex-1 flex flex-col items-center justify-center text
